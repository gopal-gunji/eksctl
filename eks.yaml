# spot-cluster.yaml

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1

managedNodeGroups:
- name: spot
  instanceTypes: ["t3.micro","t3.small","c7i-flex.large","c7i-flex.large","c8i.micro","c8i.small"]
  # AWS Free tier
  #instanceTypes: ["m7i-flex.large","c7i-flex.large","t3.small"]
  spot: true
  desiredCapacity: 2